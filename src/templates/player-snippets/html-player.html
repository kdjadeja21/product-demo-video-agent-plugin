<!-- Generated by product-demo generate_player_snippet — Watch Demo + native video + chapter buttons -->
<button type="button" class="pd-watch-demo" data-pd-open>Watch Demo</button>
<dialog class="pd-demo-dialog" data-pd-dialog>
  <div class="pd-player" data-pd-root>
    <video class="pd-video" controls playsinline preload="metadata">
      <source src="/demo/product-demo.mp4" type="video/mp4" />
      <track kind="captions" src="/demo/product-demo.vtt" srclang="en" label="English" />
    </video>
    <div class="pd-chapters" data-pd-chapters aria-label="Demo chapters">
      <!-- Chapter buttons are filled by generate_player_snippet from section timings -->
    </div>
  </div>
  <form method="dialog">
    <button type="submit" class="pd-close">Close</button>
  </form>
</dialog>
