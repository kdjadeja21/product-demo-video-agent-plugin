<!-- Generated by product-demo generate_player_snippet — Watch Demo + in-player chapters -->
<button type="button" class="pd-watch-demo" data-pd-open>Watch Demo</button>
<dialog class="pd-demo-dialog" data-pd-dialog>
  <div class="pd-player" data-pd-root>
    <div class="pd-video-wrap" data-pd-wrap>
      <video class="pd-video" playsinline preload="metadata">
        <source src="/demo/product-demo.mp4" type="video/mp4" />
        <track kind="captions" src="/demo/product-demo.vtt" srclang="en" label="English" default />
      </video>
      <!-- Active caption text is rendered here (above the chrome bar) instead of the browser's native track box -->
      <div class="pd-caption" data-pd-caption aria-live="polite"></div>
      <div class="pd-chrome" data-pd-chrome>
        <div class="pd-segments" data-pd-segments aria-label="Demo chapters">
          <!-- Chapter segments are filled by generate_player_snippet from section timings -->
        </div>
        <div class="pd-transport">
          <button type="button" class="pd-toggle" data-pd-toggle aria-label="Play"></button>
          <div class="pd-time" data-pd-time>0:00 / 0:00</div>
          <span class="pd-spacer"></span>
          <button type="button" class="pd-cc" data-pd-cc aria-label="Toggle captions" aria-pressed="true"></button>
          <button type="button" class="pd-fullscreen" data-pd-fullscreen aria-label="Enter fullscreen"></button>
        </div>
      </div>
    </div>
  </div>
</dialog>
